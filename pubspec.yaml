name: tai_translator
description: "TAI English Swahili Translator — Translate. Learn. Connect. Offline-first English-Swahili translation, dictionary & learning platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Networking (online AI translation via Groq)
  dio: ^5.4.3+1

  # Codegen helpers
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional error handling (Either<Failure, T>) for clean repositories
  dartz: ^0.10.1

  # OCR
  google_mlkit_text_recognition: ^0.13.0

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Connectivity
  connectivity_plus: ^6.0.3

  # Storage / prefs / files
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Media & sharing
  image_picker: ^1.1.2
  share_plus: ^10.1.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1
  isar_generator: ^3.1.0+1
  freezed: 2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/TAI LOGO NEW.JPG"

  # fonts:
